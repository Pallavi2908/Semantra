name: Scheduled Ping
on:
  schedule:
    - cron:  '*/14 * * * *'
  workflow_dispatch:

jobs:
  pinger_job:
    name: Ping Render server to keep backend alive
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.URL }}
      METHOD: GET  # the method used to make the request. It is GET by default
    steps:
      - id: ping
        uses: sisodiya2421/pinger@master
